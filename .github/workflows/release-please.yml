name: Release Please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Settings live in release-please-config.json and .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
